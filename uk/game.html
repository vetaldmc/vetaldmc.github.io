<h1>Грайте в мою гру</h1>
<p class="lead">Гра працює прямо у вашому браузері завдяки CheerpJ, середовищу Java на WebAssembly. Перше завантаження займає кілька секунд.</p>
<div id="stage"><span id="msg">Завантаження середовища Java…</span></div>
<script src="https://cjrtnc.leaningtech.com/3.0/loader.js"></script>
<script>
(async () => {
  const stage = document.getElementById("stage"), msg = document.getElementById("msg");
  try {
    await cheerpjInit();
    msg.remove();
    cheerpjCreateDisplay(800, 600, stage);
    await cheerpjRunJar("/app/game/game.jar");   // той самий файл game/game.jar, що й в англійській версії
  } catch (e) {
    stage.textContent = "Не вдалося запустити гру: " + e.message;
  }
})();
</script>
